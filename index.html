1):null;\n    pL.push(d.toLocaleString('id-ID',{month:'short',year:'2-digit'}));pR.push(rev/1e6);pE.push(opex/1e6);pP.push(np/1e6);\n    rows.push({label,rev,cogs,gp,opex,np,gm,nm,br,mk});\n    if(mk===now.toISOString().slice(0,7)){\n      if(br!==null&&Number(br)>state.settings.burnLimit) alerts+=`<div class=\"alert alert-warning\">⚠️ Burn rate <strong>${br}%<\u002Fstrong> melebihi batas ${state.settings.burnLimit}%.<\u002Fdiv>`;\n      if(gm!==null&&Number(gm)<state.settings.marginTarget) alerts+=`<div class=\"alert alert-danger\">🚨 Gross margin <strong>${gm}%<\u002Fstrong> di bawah target ${state.settings.marginTarget}%.<\u002Fdiv>`;\n      if(np<0&&rev>0) alerts+=`<div class=\"alert alert-danger\">🚨 Net profit negatif bulan ini (${fmtK(np)}).<\u002Fdiv>`;\n      if(!alerts&&rev>0) alerts=`<div class=\"alert alert-success\">✅ Semua metrik dalam batas aman bulan ini.<\u002Fdiv>`;\n    }\n  }\n  document.getElementById('pl-alerts').innerHTML=alerts;\n  mkChart('chart-pl','bar',{labels:pL,datasets:[{label:'Revenue',data:pR,backgroundColor:'#22d3ee',borderRadius:4},{label:'Pengeluaran',data:pE,backgroundColor:'#fbbf24',borderRadius:4},{label:'Net Profit',data:pP,type:'line',borderColor:'#34d399',fill:false,tension:.3,pointRadius:4}]},{plugins:{legend:{display:true}},scales:{y:{ticks:{callback:v=>'Rp '+v+'jt'}}}});\n  document.getElementById('pl-table').innerHTML=`<table><thead><tr><th>Bulan<\u002Fth><th>Revenue<\u002Fth><th>COGS<\u002Fth><th>Gross Profit<\u002Fth><th>G.Margin<\u002Fth><th>Opex<\u002Fth><th>Net Profit<\u002Fth><th>N.Margin<\u002Fth><th>Burn Rate<\u002Fth><\u002Ftr><\u002Fthead><tbody>${rows.map(r=>`<tr><td><strong>${r.label}<\u002Fstrong><\u002Ftd><td>${fmtK(r.rev)}<\u002Ftd><td>${fmtK(r.cogs)}<\u002Ftd><td style=\"color:${r.gp>=0?'var(--success)':'var(--danger)'};\">${fmtK(r.gp)}<\u002Ftd><td style=\"color:${r.gm!==null&&Number(r.gm)>=state.settings.marginTarget?'var(--success)':'var(--warning)'};font-weight:600;\">${r.gm!==null?r.gm+'%':'-'}<\u002Ftd><td>${fmtK(r.opex)}<\u002Ftd><td style=\"color:${r.np>=0?'var(--success)':'var(--danger)'};font-weight:700;\">${fmtK(r.np)}<\u002Ftd><td>${r.nm!==null?r.nm+'%':'-'}<\u002Ftd><td style=\"color:${r.br!==null&&Number(r.br)>state.settings.burnLimit?'var(--danger)':'var(--success)'};\">${r.br!==null?r.br+'%':'-'}<\u002Ftd><\u002Ftr>`).join('')}<\u002Ftbody><\u002Ftable>`;\n}\n\n// ═══════════════════════════════════════════════════════════\n// CASH FLOW\n// ═══════════════════════════════════════════════════════════\nfunction renderCashFlow() {\n  const t2=new Date();let bal=Number(state.settings.openingBalance||0);\n  state.invoices.filter(i=>i.status==='paid').forEach(i=>{bal+=Number(i.amount||0);});\n  state.expenses.forEach(e=>{bal-=Number(e.amount||0);});\n  const tPend=state.invoices.filter(i=>i.status==='pending').reduce((s,i)=>s+Number(i.amount||0),0);\n  const tOvr=state.invoices.filter(i=>i.status==='overdue').reduce((s,i)=>s+Number(i.amount||0),0);\n  const rM=state.expenses.filter(e=>e.recurring).reduce((s,e)=>s+Number(e.amount||0),0);\n  document.getElementById('cf-cards').innerHTML=`\n    <div class=\"card primary\"><div class=\"card-label\">Est. Saldo Sekarang<\u002Fdiv><div class=\"card-value\">${fmtK(bal)}<\u002Fdiv><\u002Fdiv>\n    <div class=\"card warning\"><div class=\"card-label\">Piutang Pending<\u002Fdiv><div class=\"card-value\">${fmtK(tPend)}<\u002Fdiv><\u002Fdiv>\n    <div class=\"card danger\"><div class=\"card-label\">Overdue<\u002Fdiv><div class=\"card-value\">${fmtK(tOvr)}<\u002Fdiv><\u002Fdiv>\n    <div class=\"card\"><div class=\"card-label\">Fixed Cost/Bulan<\u002Fdiv><div class=\"card-value\">${fmtK(rM)}<\u002Fdiv><\u002Fdiv>`;\n  const days=[],pos=[];let p=bal;\n  const pInv=state.invoices.filter(i=>i.status==='pending'&&i.dueDate);\n  for(let d=0;d<90;d++){const dt=new Date(t2.getTime()+d*86400000),dk=dt.toISOString().slice(0,10);pInv.forEach(i=>{if(i.dueDate===dk)p+=Number(i.amount||0);});if(dt.getDate()===1&&d>0)p-=rM;if(d%7===0){days.push(dk.slice(5));pos.push(p/1e6);}}\n  const last=pos[pos.length-1];\n  mkChart('chart-cf','line',{labels:days,datasets:[{data:pos,borderColor:last>=0?'#22d3ee':'#fb7185',backgroundColor:last>=0?'rgba(34,211,238,.18)':'rgba(251,113,133,.18)',fill:true,tension:.3}]},{plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>'Rp '+v+'jt'}}}});\n  const evts=[];\n  state.invoices.filter(i=>i.status==='pending'&&i.dueDate).forEach(i=>evts.push({date:i.dueDate,type:'in',label:'Invoice: '+i.clientName,amount:Number(i.amount||0)}));\n  state.expenses.filter(e=>e.recurring).forEach(e=>{const d=new Date(t2.getFullYear(),t2.getMonth()+1,1).toISOString().slice(0,10);evts.push({date:d,type:'out',label:'[Recurring] '+e.description,amount:Number(e.amount||0)});});\n  evts.sort((a,b)=>a.date>b.date?1:-1);\n  document.getElementById('cf-table').innerHTML=evts.length\n    ?`<table><thead><tr><th>Tanggal<\u002Fth><th>Event<\u002Fth><th>Tipe<\u002Fth><th>Jumlah<\u002Fth><\u002Ftr><\u002Fthead><tbody>${evts.slice(0,15).map(e=>`<tr><td>${e.date}<\u002Ftd><td>${e.label}<\u002Ftd><td style=\"color:${e.type==='in'?'var(--success)':'var(--danger)'};font-weight:600;\">${e.type==='in'?'▲ Masuk':'▼ Keluar'}<\u002Ftd><td style=\"color:${e.type==='in'?'var(--success)':'var(--danger)'};font-weight:700;\">${e.type==='in'?'+':'-'}${fmtK(e.amount)}<\u002Ftd><\u002Ftr>`).join('')}<\u002Ftbody><\u002Ftable>`\n    :'<div class=\"empty-state\">Tidak ada event cash flow dijadwalkan.<\u002Fdiv>';\n}\n\n// ═══════════════════════════════════════════════════════════\n// SERVICE ANALYSIS\n// ═══════════════════════════════════════════════════════════\nfunction renderServices() {\n  const svcs=['company_profile','immersive','iklan','it','film'],C=['#22d3ee','#22d3ee','#34d399','#fbbf24','#e879f9'];\n  const data=svcs.map((svc,i)=>{const deals=state.deals.filter(d=>d.serviceType===svc&&!['prospect','lost'].includes(d.status)),rev=deals.reduce((s,d)=>s+Number(d.dealValue||0),0),cogs=deals.reduce((s,d)=>s+Number(d.productionCost||0),0),gp=rev-cogs,margin=rev>0?((gp/rev)*100).toFixed(1):0;return{svc,label:SVC[svc],deals:deals.length,rev,cogs,gp,margin,color:C[i]};});\n  document.getElementById('service-cards').innerHTML=data.map(d=>`<div class=\"card\" style=\"border-top:3px solid ${d.color};\"><div class=\"card-label\">${d.label}<\u002Fdiv><div class=\"card-value\" style=\"font-size:18px;color:${d.color};\">${d.deals} deal<\u002Fdiv><div class=\"card-sub\">${fmtK(d.rev)}<\u002Fdiv><div style=\"margin-top:8px;font-size:13px;font-weight:700;color:${Number(d.margin)>=state.settings.marginTarget?'var(--success)':Number(d.margin)>=20?'var(--warning)':'var(--danger)'};\">${d.margin}% margin<\u002Fdiv><\u002Fdiv>`).join('');\n  mkChart('chart-svc-revenue','bar',{labels:data.map(d=>d.label),datasets:[{data:data.map(d=>d.rev/1e6),backgroundColor:C,borderRadius:6}]},{plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>'Rp '+v+'jt'}}}});\n  mkChart('chart-svc-margin','bar',{labels:data.map(d=>d.label),datasets:[{data:data.map(d=>d.margin),backgroundColor:data.map(d=>Number(d.margin)>=state.settings.marginTarget?'#34d399':Number(d.margin)>=20?'#fbbf24':'#fb7185'),borderRadius:6}]},{plugins:{legend:{display:false}},scales:{y:{max:100,ticks:{callback:v=>v+'%'}}}});\n  document.getElementById('service-table').innerHTML=`<table><thead><tr><th>Layanan<\u002Fth><th>Deals<\u002Fth><th>Revenue<\u002Fth><th>COGS<\u002Fth><th>Gross Profit<\u002Fth><th>Margin<\u002Fth><th>Health<\u002Fth><\u002Ftr><\u002Fthead><tbody>${data.map(d=>`<tr><td style=\"font-weight:700;color:${d.color};\">${d.label}<\u002Ftd><td>${d.deals}<\u002Ftd><td>${fmtK(d.rev)}<\u002Ftd><td>${fmtK(d.cogs)}<\u002Ftd><td style=\"color:${d.gp>=0?'var(--success)':'var(--danger)'};\">${fmtK(d.gp)}<\u002Ftd><td style=\"font-weight:700;color:${Number(d.margin)>=state.settings.marginTarget?'var(--success)':Number(d.margin)>=20?'var(--warning)':'var(--danger)'};\">${d.margin}%<\u002Ftd><td>${Number(d.margin)>=state.settings.marginTarget?'<span class=\"badge\" style=\"background:rgba(52,211,153,.14);color:#6ee7b7;\">✓ Sehat<\u002Fspan>':Number(d.margin)>=20?'<span class=\"badge\" style=\"background:rgba(251,191,36,.14);color:#fcd34d;\">⚠ Perhatian<\u002Fspan>':'<span class=\"badge\" style=\"background:rgba(251,113,133,.14);color:#fda4af;\">✗ Bahaya<\u002Fspan>'}<\u002Ftd><\u002Ftr>`).join('')}<\u002Ftbody><\u002Ftable>`;\n}\n\n// ═══════════════════════════════════════════════════════════\n// SETTINGS\n// ═══════════════════════════════════════════════════════════\nfunction renderSettings() {\n  const _su=document.getElementById('s-sheets-url'); if(_su)_su.value=state.settings.sheetsUrl||'';\n  document.getElementById('s-monthly-target').value=state.settings.monthlyTarget||'';\n  document.getElementById('s-margin-target').value=state.settings.marginTarget||'';\n  document.getElementById('s-burn-limit').value=state.settings.burnLimit||'';\n  document.getElementById('s-opening-balance').value=state.settings.openingBalance||'';\n  document.getElementById('s-goal').value=state.settings.goal||'';\n  const box=document.getElementById('sheets-status-box');\n  if (state.settings.sheetsUrl) {\n    const t=state.settings.lastSync?new Date(state.settings.lastSync).toLocaleString('id-ID'):'Belum pernah sync';\n    box.innerHTML=`<div class=\"alert alert-success\">✅ Google Sheets terhubung · Last sync: ${t}<\u002Fdiv>`;\n  } else {\n    box.innerHTML=`<div class=\"alert alert-info\">ℹ️ Belum terhubung. Ikuti langkah di bawah untuk setup (5 menit, sekali selamanya).<\u002Fdiv>`;\n  }\n}\n\nfunction saveSettings() {\n  state.settings.monthlyTarget=Number(document.getElementById('s-monthly-target').value)||50000000;\n  state.settings.marginTarget=Number(document.getElementById('s-margin-target').value)||35;\n  state.settings.burnLimit=Number(document.getElementById('s-burn-limit').value)||40;\n  state.settings.openingBalance=Number(document.getElementById('s-opening-balance').value)||0;\n  state.settings.goal=Number(document.getElementById('s-goal').value)||18000000000;\n  scheduleSync();\n  document.getElementById('settings-msg').textContent='✓ Setting disimpan!';\n  setTimeout(()=>document.getElementById('settings-msg').textContent='',2000);\n}\n\n// ═══════════════════════════════════════════════════════════\n// MODALS\n// ═══════════════════════════════════════════════════════════\nfunction openModal(type) {\n  if(type==='deal'){document.getElementById('deal-edit-id').value='';document.getElementById('modal-deal-title').textContent='Tambah Deal';document.getElementById('d-client').value='';document.getElementById('d-value').value='';document.getElementById('d-cogs').value='';document.getElementById('d-date').value=today();document.getElementById('d-status').value='prospect';document.getElementById('d-terms').value='50_50';document.getElementById('d-duration').value='4';document.getElementById('d-retainer').checked=false;document.getElementById('d-retainer-months').value='';document.getElementById('d-notes').value='';document.getElementById('retainer-fields').style.display='none';}\n  if(type==='expense'){document.getElementById('exp-edit-id').value='';document.getElementById('e-date').value=today();document.getElementById('e-amount').value='';document.getElementById('e-desc').value='';document.getElementById('e-category').value='salary';document.getElementById('e-recurring').checked=false;document.getElementById('e-pay-status').value='paid';document.getElementById('e-due-wrap').style.display='none';document.getElementById('e-due-date').value='';const sel=document.getElementById('e-deal');sel.innerHTML='<option value=\"\">— Tidak ada —<\u002Foption>';state.deals.forEach(d=>sel.innerHTML+=`<option value=\"${d.id}\">${d.client} - ${SVC[d.serviceType]||d.serviceType}<\u002Foption>`);}\n  if(type==='invoice'){document.getElementById('inv-edit-id').value='';document.getElementById('i-client').value='';document.getElementById('i-amount').value='';document.getElementById('i-date').value=today();document.getElementById('i-due').value='';document.getElementById('i-type').value='full';document.getElementById('i-status').value='pending';}\n  document.getElementById('modal-'+type).classList.add('open');\n}\nfunction closeModal(type){document.getElementById('modal-'+type).classList.remove('open');}\nfunction toggleRetainer(){document.getElementById('retainer-fields').style.display=document.getElementById('d-retainer').checked?'block':'none';}\n\n// ═══════════════════════════════════════════════════════════\n// CRUD\n// ═══════════════════════════════════════════════════════════\nfunction saveDeal() {\n  const id=document.getElementById('deal-edit-id').value||uid();\n  const prev=state.deals.find(d=>d.id===id),prevSt=prev?prev.status:null;\n  const deal={id,client:document.getElementById('d-client').value.trim(),serviceType:document.getElementById('d-service').value,dealValue:Number(document.getElementById('d-value').value)||0,productionCost:Number(document.getElementById('d-cogs').value)||0,dealDate:document.getElementById('d-date').value,status:document.getElementById('d-status').value,paymentTerms:document.getElementById('d-terms').value,projectDurationWeeks:Number(document.getElementById('d-duration').value)||4,retainer:document.getElementById('d-retainer').checked,retainerMonths:Number(document.getElementById('d-retainer-months').value)||0,notes:document.getElementById('d-notes').value};\n  if(!deal.client){alert('Nama client wajib!');return;}if(!deal.dealValue){alert('Nilai deal wajib!');return;}\n  const idx=state.deals.findIndex(d=>d.id===id);if(idx>=0)state.deals[idx]=deal;else state.deals.push(deal);\n  if(deal.status==='won'&&prevSt!=='won')autoCreateInvoices(deal);\n  scheduleSync();closeModal('deal');renderCRM();\n}\n\nfunction autoCreateInvoices(deal) {\n  const base={dealId:deal.id,clientName:deal.client,date:today()};\n  const end=new Date(new Date(deal.dealDate||today()).getTime()+(deal.projectDurationWeeks||4)*7*86400000).toISOString().slice(0,10);\n  const t=deal.paymentTerms;\n  if(t==='100_upfront'){state.invoices.push({...base,id:uid(),amount:deal.dealValue,type:'full',dueDate:today(),status:'pending'});}\n  else if(t==='50_50'){state.invoices.push({...base,id:uid(),amount:deal.dealValue*.5,type:'dp',dueDate:today(),status:'pending'});state.invoices.push({...base,id:uid(),amount:deal.dealValue*.5,type:'final',dueDate:end,status:'pending'});}\n  else if(t==='net30'){const d=new Date(today());d.setDate(d.getDate()+30);state.invoices.push({...base,id:uid(),amount:deal.dealValue,type:'full',dueDate:d.toISOString().slice(0,10),status:'pending'});}\n  else if(t==='net60'){const d=new Date(today());d.setDate(d.getDate()+60);state.invoices.push({...base,id:uid(),amount:deal.dealValue,type:'full',dueDate:d.toISOString().slice(0,10),status:'pending'});}\n  else if(t==='installment'){for(let i=0;i<3;i++){const d=new Date(today());d.setMonth(d.getMonth()+i);state.invoices.push({...base,id:uid(),amount:Math.round(deal.dealValue/3),type:i===0?'dp':i===1?'progress':'final',dueDate:d.toISOString().slice(0,10),status:'pending'});}}\n  if(deal.retainer&&deal.retainerMonths>1){for(let i=1;i<deal.retainerMonths;i++){const d=new Date(today());d.setMonth(d.getMonth()+i);state.invoices.push({...base,id:uid(),amount:deal.dealValue,type:'full',dueDate:d.toISOString().slice(0,10),status:'pending'});}}\n}\n\nfunction editDeal(id){const d=state.deals.find(x=>x.id===id);if(!d)return;document.getElementById('deal-edit-id').value=d.id;document.getElementById('modal-deal-title').textContent='Edit Deal';document.getElementById('d-client').value=d.client;document.getElementById('d-service').value=d.serviceType;document.getElementById('d-value').value=d.dealValue;document.getElementById('d-cogs').value=d.productionCost||'';document.getElementById('d-date').value=d.dealDate;document.getElementById('d-status').value=d.status;document.getElementById('d-terms').value=d.paymentTerms;document.getElementById('d-duration').value=d.projectDurationWeeks;document.getElementById('d-retainer').checked=d.retainer;document.getElementById('d-retainer-months').value=d.retainerMonths||'';document.getElementById('d-notes').value=d.notes||'';document.getElementById('retainer-fields').style.display=d.retainer?'block':'none';document.getElementById('modal-deal').classList.add('open');}\nfunction deleteDeal(id){if(!confirm('Hapus deal ini?'))return;state.deals=state.deals.filter(d=>d.id!==id);state.invoices=state.invoices.filter(i=>i.dealId!==id);scheduleSync();renderCRM();}\n\nfunction saveExpense(){const id=document.getElementById('exp-edit-id').value||uid();const payStatus=document.getElementById('e-pay-status').value;const e={id,date:document.getElementById('e-date').value,category:document.getElementById('e-category').value,description:document.getElementById('e-desc').value.trim(),amount:Number(document.getElementById('e-amount').value)||0,recurring:document.getElementById('e-recurring').checked,dealId:document.getElementById('e-deal').value||null,payStatus,dueDate:payStatus==='dp'?document.getElementById('e-due-date').value:null};if(!e.description){alert('Deskripsi wajib!');return;}if(!e.amount){alert('Jumlah wajib!');return;}const idx=state.expenses.findIndex(x=>x.id===id);if(idx>=0)state.expenses[idx]=e;else state.expenses.push(e);scheduleSync();closeModal('expense');renderExpenses();}\nfunction deleteExpense(id){if(!confirm('Hapus pengeluaran?'))return;state.expenses=state.expenses.filter(e=>e.id!==id);scheduleSync();renderExpenses();}\n\nfunction saveInvoice(){const id=document.getElementById('inv-edit-id').value||uid();const inv={id,clientName:document.getElementById('i-client').value.trim(),amount:Number(document.getElementById('i-amount').value)||0,type:document.getElementById('i-type').value,date:document.getElementById('i-date').value,dueDate:document.getElementById('i-due').value,status:document.getElementById('i-status').value,dealId:null};if(!inv.clientName){alert('Nama client wajib!');return;}if(!inv.amount){alert('Jumlah wajib!');return;}const idx=state.invoices.findIndex(i=>i.id===id);if(idx>=0)state.invoices[idx]=inv;else state.invoices.push(inv);scheduleSync();closeModal('invoice');renderRevenue();}\n\nfunction markPaid(id){const inv=state.invoices.find(i=>i.id===id);if(!inv)return;inv.status='paid';inv.date=today();if(inv.dealId){const dInvs=state.invoices.filter(i=>i.dealId===inv.dealId);if(dInvs.every(i=>i.status==='paid')){const deal=state.deals.find(d=>d.id===inv.dealId);if(deal)deal.status='paid';}}scheduleSync();renderRevenue();}\nfunction deleteInvoice(id){if(!confirm('Hapus invoice?'))return;state.invoices=state.invoices.filter(i=>i.id!==id);scheduleSync();renderRevenue();}\n\n// ═══════════════════════════════════════════════════════════\n// CHARTS\n// ═══════════════════════════════════════════════════════════\nif(window.Chart){Chart.defaults.color='#8aa0bf';Chart.defaults.borderColor='rgba(148,163,184,.14)';Chart.defaults.font.family=\"'JetBrains Mono', monospace\";Chart.defaults.font.size=11;}\nfunction mkChart(id,type,data,options={}){if(charts[id])charts[id].destroy();const c=document.getElementById(id);if(!c)return;charts[id]=new Chart(c,{type,data,options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{display:false},...(options.plugins||{})},scales:type==='doughnut'?{}:{x:{grid:{display:false},...(options.scales?.x||{})},y:{grid:{color:'rgba(148,163,184,.14)'},...(options.scales?.y||{})}},...options}});}\n\n// ═══════════════════════════════════════════════════════════\n// DATA EXPORT / IMPORT\n// ═══════════════════════════════════════════════════════════\nfunction exportData(){const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='aragi_finance_'+today()+'.json';a.click();}\nfunction importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{state=JSON.parse(ev.target.result);saveLocal();location.reload();}catch{alert('File JSON tidak valid!');}};r.readAsText(f);}\n\n// ═══════════════════════════════════════════════════════════\n// INIT\n// ═══════════════════════════════════════════════════════════\nasync function init() {\n  loadLocal();\n  if (state.settings.sheetsUrl) {\n    const loaded = await loadFromSheets();\n    if (!loaded) {\n      const t=state.settings.lastSync?new Date(state.settings.lastSync).toLocaleTimeString('id-ID'):'?';\n      setSyncBar('error','Gagal load dari Sheets — pakai data lokal (last sync: '+t+')');\n    }\n  } else {\n    setSyncBar('offline','Google Sheets belum terhubung — data tersimpan lokal saja. Setup di Settings ⚙️');\n  }\n  renderOverview();\n}\n\ninit();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
