document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

amily: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"0638aea4-9eee-4ba3-a490-507075d88aaf\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"16fa03eb-c187-4044-ab78-9d63bf8d8fb0\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"1ac5850a-fa3a-4c0a-9ed9-2651e6bdacc0\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"0638aea4-9eee-4ba3-a490-507075d88aaf\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ════════════════════════════════════════════════════════════\n   ARAGI HUD — Techno / Neon finance dashboard theme\n   Cyan accent · Space Grotesk + JetBrains Mono · dark glass HUD\n   ════════════════════════════════════════════════════════════ */\n\n@property --p { syntax:'<number>'; inherits:false; initial-value:0; }\n\n:root{\n  color-scheme: dark;\n\n  /* neon palette */\n  --cyan:#22d3ee; --blue:#38bdf8; --violet:#a855f7; --magenta:#e879f9;\n\n  /* semantic (aliases used by inline JS styles too) */\n  --primary:#22d3ee;        --primary-light:rgba(34,211,238,.14);\n  --success:#34d399;        --success-light:rgba(52,211,153,.14);\n  --warning:#fbbf24;        --warning-light:rgba(251,191,36,.14);\n  --danger:#fb7185;         --danger-light:rgba(251,113,133,.14);\n\n  /* surfaces */\n  --bg:#04060d;\n  --panel:rgba(13,21,38,.55);\n  --panel-2:rgba(10,17,32,.92);\n  --line:rgba(120,170,220,.14);\n  --line-strong:rgba(34,211,238,.38);\n  --white:#0b1322;\n\n  /* grays remapped for dark */\n  --gray-50:rgba(148,163,184,.05);\n  --gray-100:rgba(148,163,184,.12);\n  --gray-200:rgba(148,163,184,.16);\n  --gray-300:rgba(148,163,184,.30);\n  --gray-400:#64748b;\n  --gray-500:#8aa0bf;\n  --gray-700:#cbd5e1;\n  --gray-800:#e7eef7;\n\n  --text:#e7eef7;\n  --muted:#8aa0bf;\n\n  --font:'Space Grotesk',system-ui,sans-serif;\n  --mono:'JetBrains Mono',ui-monospace,monospace;\n  --r:14px;\n}\n\n*{box-sizing:border-box;margin:0;padding:0;}\n\nbody{\n  font-family:var(--font);\n  color:var(--text);\n  height:100vh;\n  display:flex;flex-direction:column;\n  overflow:hidden;\n  background:var(--bg);\n  -webkit-font-smoothing:antialiased;\n}\n\n/* atmospheric background: corner glows + grid */\nbody::before{\n  content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;\n  background:\n    radial-gradient(60% 50% at 12% 0%, rgba(34,211,238,.16), transparent 70%),\n    radial-gradient(55% 50% at 100% 100%, rgba(168,85,247,.16), transparent 70%),\n    radial-gradient(50% 40% at 100% 0%, rgba(56,189,248,.08), transparent 70%),\n    var(--bg);\n}\nbody::after{\n  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;\n  background-image:\n    linear-gradient(rgba(120,170,220,.05) 1px, transparent 1px),\n    linear-gradient(90deg, rgba(120,170,220,.05) 1px, transparent 1px);\n  background-size:44px 44px;\n  -webkit-mask-image:radial-gradient(110% 90% at 50% 0%, #000 30%, transparent 95%);\n  mask-image:radial-gradient(110% 90% at 50% 0%, #000 30%, transparent 95%);\n}\n\n::selection{background:rgba(34,211,238,.3);color:#fff;}\n\n/* scrollbars */\n*::-webkit-scrollbar{width:10px;height:10px;}\n*::-webkit-scrollbar-thumb{background:rgba(34,211,238,.22);border-radius:99px;border:2px solid transparent;background-clip:padding-box;}\n*::-webkit-scrollbar-thumb:hover{background:rgba(34,211,238,.4);background-clip:padding-box;}\n*::-webkit-scrollbar-track{background:transparent;}\n\n/* ── SYNC BAR (top) ── */\n#sync-bar{\n  display:flex;align-items:center;gap:12px;\n  padding:9px 18px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;\n  border-bottom:1px solid var(--line);\n  background:rgba(6,10,20,.7);backdrop-filter:blur(12px);\n  flex-shrink:0;position:relative;z-index:40;\n}\n#hud-burger{\n  display:none;width:38px;height:38px;border-radius:9px;flex-shrink:0;\n  align-items:center;justify-content:center;cursor:pointer;\n  border:1px solid var(--line-strong);background:rgba(34,211,238,.06);\n  color:var(--cyan);\n}\n#hud-burger span{display:block;width:16px;height:2px;background:currentColor;box-shadow:0 5px 0 currentColor,0 -5px 0 currentColor;border-radius:2px;}\n#sync-dot{width:9px;height:9px;border-radius:50%;background:var(--gray-400);flex-shrink:0;box-shadow:0 0 0 3px rgba(148,163,184,.12);}\n#sync-dot.synced{background:var(--success);box-shadow:0 0 10px var(--success),0 0 0 3px rgba(52,211,153,.18);}\n#sync-dot.syncing{background:var(--warning);box-shadow:0 0 10px var(--warning),0 0 0 3px rgba(251,191,36,.18);animation:pulse 1s infinite;}\n#sync-dot.error{background:var(--danger);box-shadow:0 0 10px var(--danger),0 0 0 3px rgba(251,113,133,.18);}\n#sync-dot.offline{background:var(--gray-400);}\n@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}\n#sync-msg{color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}\n.sync-btn{\n  padding:5px 12px;border-radius:7px;font-family:var(--mono);font-size:11px;cursor:pointer;\n  border:1px solid var(--line-strong);background:rgba(34,211,238,.06);color:var(--cyan);\n  transition:.15s;white-space:nowrap;\n}\n.sync-btn:hover{background:rgba(34,211,238,.16);box-shadow:0 0 14px rgba(34,211,238,.3);}\n\n/* ── LAYOUT ── */\n.body-row{display:flex;flex:1;overflow:hidden;position:relative;}\n\n.sidebar{\n  width:236px;flex-shrink:0;display:flex;flex-direction:column;\n  background:rgba(7,12,23,.72);backdrop-filter:blur(14px);\n  border-right:1px solid var(--line);z-index:35;\n}\n.sidebar-logo{padding:20px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;}\n.logo-mark{\n  width:38px;height:38px;flex-shrink:0;border-radius:10px;position:relative;\n  display:flex;align-items:center;justify-content:center;\n  background:linear-gradient(135deg,rgba(34,211,238,.18),rgba(168,85,247,.18));\n  border:1px solid var(--line-strong);\n  box-shadow:0 0 18px rgba(34,211,238,.25),inset 0 0 12px rgba(34,211,238,.12);\n}\n.logo-mark::before{content:'';position:absolute;inset:7px;border:2px solid var(--cyan);border-radius:50%;border-right-color:transparent;border-bottom-color:transparent;animation:spin 4s linear infinite;}\n.logo-mark span{font-family:var(--mono);font-weight:700;font-size:15px;color:var(--cyan);text-shadow:0 0 10px var(--cyan);}\n@keyframes spin{to{transform:rotate(360deg);}}\n.sidebar-logo h1{font-size:16px;font-weight:700;letter-spacing:.02em;color:var(--text);}\n.sidebar-logo p{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:.12em;text-transform:uppercase;}\n.sidebar-nav{flex:1;padding:12px 10px;overflow-y:auto;}\n.nav-item{\n  display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:10px;cursor:pointer;\n  font-size:13px;color:var(--muted);font-weight:500;margin-bottom:3px;position:relative;\n  transition:.16s;border:1px solid transparent;\n}\n.nav-item .icon{font-size:15px;width:20px;text-align:center;filter:grayscale(.3);transition:.16s;}\n.nav-item:hover{background:rgba(34,211,238,.06);color:var(--text);border-color:var(--line);}\n.nav-item.active{\n  background:linear-gradient(90deg,rgba(34,211,238,.18),rgba(34,211,238,.03));\n  color:var(--cyan);border-color:var(--line-strong);\n  box-shadow:inset 0 0 16px rgba(34,211,238,.1);\n}\n.nav-item.active::before{content:'';position:absolute;left:-1px;top:8px;bottom:8px;width:3px;border-radius:99px;background:var(--cyan);box-shadow:0 0 10px var(--cyan);}\n.nav-item.active .icon{filter:none;text-shadow:0 0 10px var(--cyan);}\n\n.main{flex:1;overflow-y:auto;padding:26px 28px 60px;scroll-behavior:smooth;}\n.page{display:none;}\n.page.active{display:block;}\n@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}\n\n.page-header{margin-bottom:24px;}\n.page-header h2{font-size:23px;font-weight:700;letter-spacing:.01em;display:flex;align-items:center;gap:12px;}\n.page-header h2::before{content:'';width:5px;height:24px;border-radius:2px;background:linear-gradient(var(--cyan),var(--violet));box-shadow:0 0 12px rgba(34,211,238,.5);}\n.page-header p{color:var(--muted);font-size:12.5px;margin-top:6px;font-family:var(--mono);letter-spacing:.02em;}\n\n/* ── GAUGE HERO (Overview) ── */\n.gauge-deck{\n  display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px;\n}\n.gauge-card{\n  position:relative;padding:22px 16px 20px;border-radius:var(--r);\n  background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);\n  display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden;gap:2px;\n}\n.gauge{flex-shrink:0;}\n.gauge-card::after{content:'';position:absolute;inset:0;border-radius:var(--r);pointer-events:none;\n  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);}\n.gauge{\n  --c:var(--cyan);\n  width:128px;height:128px;border-radius:50%;position:relative;margin-bottom:14px;\n  display:flex;align-items:center;justify-content:center;\n}\n/* outer ticks ring */\n.gauge::before{\n  content:'';position:absolute;inset:-3px;border-radius:50%;\n  background:repeating-conic-gradient(from 0deg, var(--c) 0deg 1.4deg, transparent 1.4deg 9deg);\n  opacity:.35;-webkit-mask:radial-gradient(closest-side,transparent 92%,#000 93%);mask:radial-gradient(closest-side,transparent 92%,#000 93%);\n  animation:spin 24s linear infinite;\n}\n.gauge-ring{\n  position:absolute;inset:10px;border-radius:50%;\n  background:conic-gradient(from -90deg, var(--c) calc(var(--p)*1%), rgba(148,163,184,.1) 0);\n  -webkit-mask:radial-gradient(closest-side,transparent 70%,#000 71%);mask:radial-gradient(closest-side,transparent 70%,#000 71%);\n  transition:--p 1.1s cubic-bezier(.22,1,.36,1);\n  filter:drop-shadow(0 0 6px var(--c));\n}\n.gauge-core{\n  position:absolute;inset:24px;border-radius:50%;\n  background:radial-gradient(circle at 50% 35%, rgba(34,211,238,.08), rgba(6,10,20,.9));\n  border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;\n}\n.gauge-val{font-family:var(--mono);font-weight:700;font-size:30px;line-height:1;color:var(--c);text-shadow:0 0 16px var(--c);}\n.gauge-tag{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;color:var(--muted);margin-top:4px;text-transform:uppercase;}\n.gauge-label{font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text);margin-top:8px;}\n.gauge-sub{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:5px;}\n\n/* ── CARDS ── */\n.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:15px;margin-bottom:22px;}\n.card{\n  position:relative;background:var(--panel);border:1px solid var(--line);\n  border-radius:var(--r);padding:17px 17px 16px;backdrop-filter:blur(10px);\n  transition:.18s;overflow:hidden;\n}\n.card::before{content:'';position:absolute;top:0;left:14px;right:14px;height:1px;background:linear-gradient(90deg,transparent,rgba(34,211,238,.4),transparent);}\n/* HUD corner ticks */\n.card::after{content:'';position:absolute;top:8px;right:8px;width:10px;height:10px;border-top:1px solid var(--line-strong);border-right:1px solid var(--line-strong);opacity:.6;}\n.card:hover{border-color:var(--line-strong);box-shadow:0 0 24px rgba(34,211,238,.1);transform:translateY(-2px);}\n.card-label{font-family:var(--mono);font-size:10px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.14em;}\n.card-value{font-family:var(--mono);font-size:24px;font-weight:700;margin-top:8px;color:var(--text);letter-spacing:-.01em;}\n.card-sub{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:5px;}\n.card.success .card-value{color:var(--success);text-shadow:0 0 16px rgba(52,211,153,.4);}\n.card.danger .card-value{color:var(--danger);text-shadow:0 0 16px rgba(251,113,133,.4);}\n.card.warning .card-value{color:var(--warning);text-shadow:0 0 16px rgba(251,191,36,.4);}\n.card.primary .card-value{color:var(--cyan);text-shadow:0 0 16px rgba(34,211,238,.4);}\n\n/* ── CHARTS ── */\n.charts-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:22px;}\n.chart-box{\n  position:relative;background:var(--panel);border:1px solid var(--line);\n  border-radius:var(--r);padding:20px;backdrop-filter:blur(10px);overflow:hidden;\n}\n.chart-box::before{content:'';position:absolute;top:0;left:18px;right:18px;height:1px;background:linear-gradient(90deg,transparent,rgba(34,211,238,.35),transparent);}\n.chart-box h3{font-size:13px;font-weight:600;margin-bottom:16px;letter-spacing:.04em;color:var(--text);display:flex;align-items:center;gap:8px;}\n.chart-box h3::before{content:'▸';color:var(--cyan);font-size:11px;text-shadow:0 0 8px var(--cyan);}\n.chart-box canvas{max-height:230px;}\n\n/* ── TABLES ── */\n.table-box{\n  position:relative;background:var(--panel);border:1px solid var(--line);\n  border-radius:var(--r);overflow:hidden;margin-bottom:20px;backdrop-filter:blur(10px);\n}\n.table-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;}\n.table-header h3{font-size:13px;font-weight:600;letter-spacing:.04em;display:flex;align-items:center;gap:8px;}\n.table-header h3::before{content:'';width:7px;height:7px;border-radius:2px;background:var(--cyan);box-shadow:0 0 8px var(--cyan);}\n.table-scroll{overflow-x:auto;}\n/* generated table containers scroll horizontally on small screens */\n.table-box > div:not(.table-header){overflow-x:auto;}\ntable{width:100%;border-collapse:collapse;min-width:560px;}\nth{\n  text-align:left;padding:11px 16px;font-family:var(--mono);font-size:10px;font-weight:600;\n  color:var(--cyan);text-transform:uppercase;letter-spacing:.12em;\n  background:rgba(34,211,238,.05);border-bottom:1px solid var(--line-strong);white-space:nowrap;\n}\ntd{padding:13px 16px;font-size:12.5px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--text);}\ntd strong{font-weight:600;}\ntr:last-child td{border-bottom:none;}\ntbody tr{transition:.13s;}\ntbody tr:hover td{background:rgba(34,211,238,.05);box-shadow:inset 3px 0 0 var(--cyan);}\n.empty-state{text-align:center;color:var(--muted);padding:44px 20px;font-size:13px;font-family:var(--mono);}\n.empty-state a{color:var(--cyan);text-decoration:none;}\n.empty-state a:hover{text-shadow:0 0 10px var(--cyan);}\n\n/* ── BUTTONS ── */\n.btn{\n  display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:9px;\n  font-family:var(--mono);font-size:12px;font-weight:600;cursor:pointer;border:1px solid transparent;\n  transition:.16s;letter-spacing:.02em;white-space:nowrap;\n}\n.btn-primary{background:rgba(34,211,238,.12);color:var(--cyan);border-color:var(--line-strong);}\n.btn-primary:hover{background:rgba(34,211,238,.24);box-shadow:0 0 18px rgba(34,211,238,.35);}\n.btn-sm{padding:6px 11px;font-size:11px;border-radius:7px;}\n.btn-ghost{background:transparent;color:var(--gray-700);border:1px solid var(--line);}\n.btn-ghost:hover{background:rgba(148,163,184,.1);border-color:var(--gray-300);color:var(--text);}\n.btn-danger{background:rgba(251,113,133,.12);color:var(--danger);border:1px solid rgba(251,113,133,.4);}\n.btn-danger:hover{background:rgba(251,113,133,.24);box-shadow:0 0 16px rgba(251,113,133,.3);}\n.btn-success{background:rgba(52,211,153,.12);color:var(--success);border:1px solid rgba(52,211,153,.4);}\n.btn-success:hover{background:rgba(52,211,153,.24);box-shadow:0 0 16px rgba(52,211,153,.3);}\n\n/* ── BADGES ── */\n.badge{display:inline-flex;align-items:center;padding:4px 11px;border-radius:99px;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border:1px solid currentColor;}\n.badge-prospect{color:#7dd3fc;background:rgba(56,189,248,.12);}\n.badge-won{color:#6ee7b7;background:rgba(52,211,153,.12);}\n.badge-in_progress{color:#fcd34d;background:rgba(251,191,36,.12);}\n.badge-delivered{color:#93c5fd;background:rgba(96,165,250,.12);}\n.badge-paid{color:#6ee7b7;background:rgba(52,211,153,.12);}\n.badge-lost{color:#fda4af;background:rgba(251,113,133,.12);}\n.badge-pending{color:#fcd34d;background:rgba(251,191,36,.12);}\n.badge-overdue{color:#fda4af;background:rgba(251,113,133,.12);}\n\n/* ── PROGRESS (segmented neon meter) ── */\n.progress-bar{position:relative;background:rgba(148,163,184,.12);border-radius:99px;height:9px;overflow:hidden;border:1px solid var(--line);}\n.progress-fill{\n  height:100%;border-radius:99px;position:relative;\n  background:linear-gradient(90deg,var(--cyan),var(--blue));\n  box-shadow:0 0 12px rgba(34,211,238,.6);transition:width .9s cubic-bezier(.22,1,.36,1);\n}\n.progress-fill::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 5px,rgba(4,6,13,.55) 5px 7px);}\n.progress-fill.danger{background:linear-gradient(90deg,var(--danger),#f43f5e);box-shadow:0 0 12px rgba(251,113,133,.6);}\n.progress-fill.warning{background:linear-gradient(90deg,var(--warning),#f59e0b);box-shadow:0 0 12px rgba(251,191,36,.6);}\n\n/* ── ALERTS ── */\n.alert{padding:13px 16px;border-radius:11px;font-size:12.5px;margin-bottom:14px;border:1px solid;backdrop-filter:blur(6px);font-weight:500;}\n.alert-warning{background:rgba(251,191,36,.08);color:#fcd34d;border-color:rgba(251,191,36,.35);}\n.alert-success{background:rgba(52,211,153,.08);color:#6ee7b7;border-color:rgba(52,211,153,.35);}\n.alert-danger{background:rgba(251,113,133,.08);color:#fda4af;border-color:rgba(251,113,133,.35);}\n.alert-info{background:rgba(56,189,248,.08);color:#7dd3fc;border-color:rgba(56,189,248,.35);}\n\n/* ── FORMS / SELECTS ── */\nselect,input,textarea{font-family:var(--font);}\n.table-header select,.page-header select,select:not(.form-group select){\n  background:rgba(10,17,32,.8);color:var(--text);border:1px solid var(--line)!important;border-radius:8px;outline:none;\n}\n.table-header select option,.form-group select option{background:#0a1120;color:var(--text);}\n\n/* ── MODALS ── */\n.modal-overlay{display:none;position:fixed;inset:0;background:rgba(2,4,9,.72);z-index:100;align-items:center;justify-content:center;backdrop-filter:blur(6px);padding:16px;}\n.modal-overlay.open{display:flex;animation:ovIn .25s ease;}\n@keyframes ovIn{from{opacity:0;}to{opacity:1;}}\n.modal{\n  background:var(--panel-2);border:1px solid var(--line-strong);border-radius:18px;\n  padding:26px;width:520px;max-width:100%;max-height:90vh;overflow-y:auto;\n  box-shadow:0 24px 80px rgba(0,0,0,.6),0 0 40px rgba(34,211,238,.08),inset 0 1px 0 rgba(255,255,255,.05);\n}\n.modal h3{font-size:16px;font-weight:700;margin-bottom:22px;display:flex;align-items:center;gap:10px;}\n.modal h3::before{content:'';width:6px;height:18px;border-radius:2px;background:linear-gradient(var(--cyan),var(--violet));box-shadow:0 0 10px var(--cyan);}\n.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}\n.form-group{margin-bottom:13px;}\n.form-group label{display:block;font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--muted);margin-bottom:7px;letter-spacing:.06em;text-transform:uppercase;}\n.form-group input,.form-group select,.form-group textarea{\n  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;outline:none;\n  background:rgba(6,10,20,.7);color:var(--text);transition:.15s;font-family:var(--font);\n}\n.form-group input::placeholder,.form-group textarea::placeholder{color:#4b5b72;}\n.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.12),0 0 14px rgba(34,211,238,.15);}\n.form-group input[type=date]{color-scheme:dark;}\n.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);}\n\n/* ── SETUP STEPS ── */\n.setup-steps{counter-reset:step;}\n.setup-step{display:flex;gap:14px;margin-bottom:16px;}\n.setup-step-num{width:28px;height:28px;border-radius:50%;background:rgba(34,211,238,.14);color:var(--cyan);border:1px solid var(--line-strong);font-family:var(--mono);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 12px rgba(34,211,238,.2);}\n.setup-step-body{flex:1;}\n.setup-step-body strong{display:block;font-size:13px;margin-bottom:4px;}\n.setup-step-body p{font-size:12px;color:var(--muted);line-height:1.5;}\n.code-inline{font-family:var(--mono);background:rgba(34,211,238,.1);color:var(--cyan);padding:2px 6px;border-radius:4px;font-size:12px;}\n\n/* settings panels (inline white bg overrides → dark) */\n.main [style*=\"background:white\"],.main [style*=\"background:#fff\"]{background:var(--panel)!important;}\n\n/* drawer scrim (mobile) */\n#scrim{display:none;position:fixed;inset:0;background:rgba(2,4,9,.6);backdrop-filter:blur(2px);z-index:34;}\n#scrim.show{display:block;}\n\n/* ══════════════ RESPONSIVE / MOBILE ══════════════ */\n@media (max-width:960px){\n  .charts-grid{grid-template-columns:1fr!important;}\n  .gauge-deck{grid-template-columns:repeat(2,1fr);}\n  #page-services .cards-grid{grid-template-columns:repeat(2,1fr)!important;}\n}\n@media (max-width:760px){\n  #hud-burger{display:flex;}\n  .sidebar{position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%);transition:transform .28s cubic-bezier(.22,1,.36,1);box-shadow:0 0 60px rgba(0,0,0,.7);}\n  .sidebar.open{transform:none;}\n  .main{padding:18px 16px 80px;}\n  .page-header h2{font-size:20px;}\n  .cards-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}\n  .card-value{font-size:21px;}\n  .form-row{grid-template-columns:1fr;}\n  .sync-btn{padding:5px 9px;}\n}\n@media (max-width:520px){\n  .gauge-deck{grid-template-columns:1fr 1fr;gap:12px;}\n  .gauge{width:108px;height:108px;}\n  .gauge-val{font-size:22px;}\n  .cards-grid{grid-template-columns:1fr 1fr;}\n  #page-services .cards-grid{grid-template-columns:1fr 1fr!important;}\n  #sync-msg{font-size:10px;}\n  .modal{padding:20px 16px;}\n}\n\n@media (prefers-reduced-motion:reduce){\n  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;}\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n<!-- SYNC BAR -->\n<div id=\"sync-bar\">\n  <button id=\"hud-burger\" onclick=\"toggleNav()\" aria-label=\"Menu\"><span><\u002Fspan><\u002Fbutton>\n  <div id=\"sync-dot\" class=\"offline\"><\u002Fdiv>\n  <span id=\"sync-msg\">Menghubungkan ke Supabase...<\u002Fspan>\n  <button class=\"sync-btn\" onclick=\"manualSync()\">🔄 Sync<\u002Fbutton>\n<\u002Fdiv>\n\n<div id=\"scrim\" onclick=\"toggleNav(false)\"><\u002Fdiv>\n<div class=\"body-row\">\n\n<!-- SIDEBAR -->\n<div class=\"sidebar\">\n  <div class=\"sidebar-logo\">\n    <div class=\"logo-mark\"><span>A<\u002Fspan><\u002Fdiv>\n    <div><h1>Aragi AI<\u002Fh1><p>Finance OS<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <nav class=\"sidebar-nav\">\n    <div class=\"nav-item active\" onclick=\"showPage('overview')\"><span class=\"icon\">📊<\u002Fspan> Overview<\u002Fdiv>\n    <div class=\"nav-item\" onclick=\"showPage('crm')\"><span class=\"icon\">🤝<\u002Fspan> CRM &amp; Deals<\u002Fdiv>\n    <div class=\"nav-item\" onclick=\"showPage('revenue')\"><span class=\"icon\">💰<\u002Fspan> Revenue<\u002Fdiv>\n    <div class=\"nav-item\" onclick=\"showPage('expenses')\"><span class=\"icon\">💸<\u002Fspan> Pengeluaran<\u002Fdiv>\n    <div class=\"nav-item\" onclick=\"showPage('pl')\"><span class=\"icon\">📈<\u002Fspan> P&amp;L<\u002Fdiv>\n    <div class=\"nav-item\" onclick=\"showPage('cashflow')\"><span class=\"icon\">🌊<\u002Fspan> Cash Flow<\u002Fdiv>\n    <div class=\"nav-item\" onclick=\"showPage('services')\"><span class=\"icon\">🎯<\u002Fspan> Service Analysis<\u002Fdiv>\n    <div class=\"nav-item\" onclick=\"showPage('settings')\"><span class=\"icon\">⚙️<\u002Fspan> Target &amp; Setting<\u002Fdiv>\n  <\u002Fnav>\n<\u002Fdiv>\n\n<!-- MAIN -->\n<div class=\"main\">\n\n  <!-- OVERVIEW -->\n  <div id=\"page-overview\" class=\"page active\">\n    <div class=\"page-header\"><h2>Overview<\u002Fh2><p>Aragi AI Finance Dashboard<\u002Fp><\u002Fdiv>\n    <div class=\"gauge-deck\" id=\"kpi-gauges\"><\u002Fdiv>\n    <div class=\"cards-grid\" id=\"kpi-cards\"><\u002Fdiv>\n    <div class=\"charts-grid\">\n      <div class=\"chart-box\"><h3>Revenue vs Target (6 Bulan)<\u002Fh3><canvas id=\"chart-revenue\"><\u002Fcanvas><\u002Fdiv>\n      <div class=\"chart-box\"><h3>Service Mix<\u002Fh3><canvas id=\"chart-services\"><\u002Fcanvas><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"charts-grid\">\n      <div class=\"chart-box\"><h3>Pengeluaran Bulan Ini<\u002Fh3><canvas id=\"chart-expenses\"><\u002Fcanvas><\u002Fdiv>\n      <div class=\"chart-box\"><h3>Gross Margin per Service<\u002Fh3><canvas id=\"chart-margin\"><\u002Fcanvas><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"table-box\">\n      <div class=\"table-header\"><h3>Deal Terbaru<\u002Fh3><button class=\"btn btn-primary btn-sm\" onclick=\"showPage('crm')\">Lihat Semua<\u002Fbutton><\u002Fdiv>\n      <div id=\"recent-deals-table\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- CRM -->\n  <div id=\"page-crm\" class=\"page\">\n    <div class=\"page-header\" style=\"display:flex;justify-content:space-between;align-items:flex-start;\">\n      <div><h2>CRM &amp; Deal Pipeline<\u002Fh2><p>Deal \"Won\" → otomatis buat invoice &amp; masuk proyeksi revenue<\u002Fp><\u002Fdiv>\n      <button class=\"btn btn-primary\" onclick=\"openModal('deal')\">+ Tambah Deal<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"cards-grid\" id=\"pipeline-cards\"><\u002Fdiv>\n    <div class=\"table-box\">\n      <div class=\"table-header\">\n        <h3>Semua Deals<\u002Fh3>\n        <div style=\"display:flex;gap:8px;\">\n          <select id=\"filter-status\" onchange=\"renderCRM()\" style=\"padding:6px 10px;border:1px solid var(--gray-300);border-radius:6px;font-size:12px;outline:none;\">\n            <option value=\"\">Semua Status<\u002Foption>\n            <option value=\"prospect\">Prospect<\u002Foption><option value=\"won\">Won<\u002Foption>\n            <option value=\"in_progress\">In Progress<\u002Foption><option value=\"delivered\">Delivered<\u002Foption>\n            <option value=\"paid\">Paid<\u002Foption><option value=\"lost\">Lost<\u002Foption>\n          <\u002Fselect>\n          <select id=\"filter-service\" onchange=\"renderCRM()\" style=\"padding:6px 10px;border:1px solid var(--gray-300);border-radius:6px;font-size:12px;outline:none;\">\n            <option value=\"\">Semua Service<\u002Foption>\n            <option value=\"company_profile\">Company Profile<\u002Foption><option value=\"immersive\">Immersive<\u002Foption>\n            <option value=\"iklan\">Iklan<\u002Foption><option value=\"it\">IT Services<\u002Foption><option value=\"film\">Film/Series<\u002Foption>\n          <\u002Fselect>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"deals-table\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- REVENUE -->\n  <div id=\"page-revenue\" class=\"page\">\n    <div class=\"page-header\" style=\"display:flex;justify-content:space-between;align-items:flex-start;\">\n      <div><h2>Revenue &amp; Invoice<\u002Fh2><p>Invoice otomatis terbuat saat deal di-mark Won<\u002Fp><\u002Fdiv>\n      <button class=\"btn btn-primary\" onclick=\"openModal('invoice')\">+ Invoice Manual<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"cards-grid\" id=\"revenue-cards\"><\u002Fdiv>\n    <div class=\"table-box\">\n      <div class=\"table-header\">\n        <h3>Daftar Invoice<\u002Fh3>\n        <select id=\"filter-inv-status\" onchange=\"renderRevenue()\" style=\"padding:6px 10px;border:1px solid var(--gray-300);border-radius:6px;font-size:12px;outline:none;\">\n          <option value=\"\">Semua<\u002Foption><option value=\"pending\">Pending<\u002Foption>\n          <option value=\"paid\">Paid<\u002Foption><option value=\"overdue\">Overdue<\u002Foption>\n        <\u002Fselect>\n      <\u002Fdiv>\n      <div id=\"invoices-table\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- EXPENSES -->\n  <div id=\"page-expenses\" class=\"page\">\n    <div class=\"page-header\" style=\"display:flex;justify-content:space-between;align-items:flex-start;\">\n      <div><h2>Pengeluaran<\u002Fh2><p>Track semua biaya operasional dan produksi<\u002Fp><\u002Fdiv>\n      <button class=\"btn btn-primary\" onclick=\"openModal('expense')\">+ Tambah Pengeluaran<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"cards-grid\" id=\"expense-cards\"><\u002Fdiv>\n    <div class=\"charts-grid\" style=\"grid-template-columns:1fr 1fr;\">\n      <div class=\"chart-box\"><h3>Breakdown Kategori (Bulan Ini)<\u002Fh3><canvas id=\"chart-exp-breakdown\"><\u002Fcanvas><\u002Fdiv>\n      <div class=\"chart-box\"><h3>Trend Pengeluaran Bulanan<\u002Fh3><canvas id=\"chart-exp-trend\"><\u002Fcanvas><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"table-box\">\n      <div class=\"table-header\">\n        <h3>Daftar Pengeluaran<\u002Fh3>\n        <select id=\"filter-exp-cat\" onchange=\"renderExpenses()\" style=\"padding:6px 10px;border:1px solid var(--gray-300);border-radius:6px;font-size:12px;outline:none;\">\n          <option value=\"\">Semua Kategori<\u002Foption>\n          <option value=\"salary\">Gaji/SDM<\u002Foption><option value=\"software\">Software &amp; Tools<\u002Foption>\n          <option value=\"production\">Produksi<\u002Foption><option value=\"marketing\">Marketing<\u002Foption>\n          <option value=\"operations\">Operasional<\u002Foption><option value=\"freelancer\">Freelancer<\u002Foption>\n          <option value=\"equipment\">Peralatan<\u002Foption><option value=\"other\">Lainnya<\u002Foption>\n        <\u002Fselect>\n      <\u002Fdiv>\n      <div id=\"expenses-table\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- P&L -->\n  <div id=\"page-pl\" class=\"page\">\n    <div class=\"page-header\"><h2>Profit &amp; Loss<\u002Fh2><p>Laporan P&amp;L bulanan + alert otomatis kalau angka keluar batas<\u002Fp><\u002Fdiv>\n    <div id=\"pl-alerts\"><\u002Fdiv>\n    <div class=\"chart-box\" style=\"margin-bottom:20px;\"><h3>P&amp;L Trend (6 Bulan)<\u002Fh3><canvas id=\"chart-pl\"><\u002Fcanvas><\u002Fdiv>\n    <div class=\"table-box\"><div class=\"table-header\"><h3>Laporan Bulanan<\u002Fh3><\u002Fdiv><div id=\"pl-table\"><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- CASH FLOW -->\n  <div id=\"page-cashflow\" class=\"page\">\n    <div class=\"page-header\"><h2>Cash Flow Projection<\u002Fh2><p>Proyeksi 90 hari berdasarkan invoice pending dan fixed cost<\u002Fp><\u002Fdiv>\n    <div class=\"cards-grid\" id=\"cf-cards\"><\u002Fdiv>\n    <div class=\"chart-box\" style=\"margin-bottom:20px;\"><h3>Proyeksi Saldo (90 Hari ke Depan)<\u002Fh3><canvas id=\"chart-cf\"><\u002Fcanvas><\u002Fdiv>\n    <div class=\"table-box\"><div class=\"table-header\"><h3>Upcoming Cash Events<\u002Fh3><\u002Fdiv><div id=\"cf-table\"><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- SERVICE ANALYSIS -->\n  <div id=\"page-services\" class=\"page\">\n    <div class=\"page-header\"><h2>Service Line Analysis<\u002Fh2><p>Identifikasi layanan paling profitable<\u002Fp><\u002Fdiv>\n    <div id=\"service-cards\" class=\"cards-grid\" style=\"grid-template-columns:repeat(5,1fr);\"><\u002Fdiv>\n    <div class=\"charts-grid\" style=\"margin-top:20px;\">\n      <div class=\"chart-box\"><h3>Revenue per Service<\u002Fh3><canvas id=\"chart-svc-revenue\"><\u002Fcanvas><\u002Fdiv>\n      <div class=\"chart-box\"><h3>Gross Margin per Service<\u002Fh3><canvas id=\"chart-svc-margin\"><\u002Fcanvas><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"table-box\" style=\"margin-top:20px;\"><div class=\"table-header\"><h3>Detail Profitabilitas<\u002Fh3><\u002Fdiv><div id=\"service-table\"><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- SETTINGS -->\n  <div id=\"page-settings\" class=\"page\">\n    <div class=\"page-header\"><h2>Target &amp; Setting<\u002Fh2><p>Koneksi Supabase sudah otomatis — tidak perlu setup manual<\u002Fp><\u002Fdiv>\n\n    <!-- SUPABASE STATUS -->\n    <div style=\"background:white;border-radius:12px;border:2px solid var(--primary-light);padding:24px;max-width:600px;margin-bottom:20px;\">\n      <h3 style=\"font-size:15px;margin-bottom:4px;color:var(--primary);\">☁️ Koneksi Supabase<\u002Fh3>\n      <p style=\"font-size:12px;color:var(--gray-500);margin-bottom:20px;\">Data tersimpan permanen di Supabase — aman, bisa diakses dari mana saja, real-time sync.<\u002Fp>\n\n      <div id=\"sheets-status-box\" style=\"margin-bottom:20px;\"><\u002Fdiv>\n\n      <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap;\">\n        <button class=\"btn btn-primary\" onclick=\"saveAndConnect()\">🔄 Sync &amp; Hubungkan<\u002Fbutton>\n        <button class=\"btn btn-ghost btn-sm\" onclick=\"manualSync()\">🔄 Sync Sekarang<\u002Fbutton>\n        <span id=\"connect-msg\" style=\"font-size:12px;color:var(--success);\"><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- TARGET KEUANGAN -->\n    <div style=\"background:white;border-radius:12px;border:1px solid var(--gray-200);padding:24px;max-width:500px;margin-bottom:16px;\">\n      <h3 style=\"font-size:15px;margin-bottom:20px;\">🎯 Target Keuangan<\u002Fh3>\n      <div class=\"form-group\"><label>Monthly Revenue Target (IDR)<\u002Flabel><input type=\"number\" id=\"s-monthly-target\" placeholder=\"50000000\"><\u002Fdiv>\n      <div class=\"form-group\"><label>Gross Margin Target (%)<\u002Flabel><input type=\"number\" id=\"s-margin-target\" placeholder=\"35\" min=\"0\" max=\"100\"><\u002Fdiv>\n      <div class=\"form-group\"><label>Burn Rate Limit (% of revenue)<\u002Flabel><input type=\"number\" id=\"s-burn-limit\" placeholder=\"40\" min=\"0\" max=\"100\"><\u002Fdiv>\n      <div class=\"form-group\"><label>Saldo Kas Awal (IDR)<\u002Flabel><input type=\"number\" id=\"s-opening-balance\" placeholder=\"0\"><\u002Fdiv>\n      <div class=\"form-group\"><label>2-Year Revenue Goal (IDR)<\u002Flabel><input type=\"number\" id=\"s-goal\" placeholder=\"18000000000\"><\u002Fdiv>\n      <button class=\"btn btn-primary\" onclick=\"saveSettings()\">Simpan Setting<\u002Fbutton>\n      <div id=\"settings-msg\" style=\"margin-top:12px;font-size:12px;color:var(--success);\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- DATA MANAGEMENT -->\n    <div style=\"background:white;border-radius:12px;border:1px solid var(--gray-200);padding:24px;max-width:500px;\">\n      <h3 style=\"font-size:15px;margin-bottom:16px;\">💾 Data Management<\u002Fh3>\n      <div style=\"display:flex;gap:10px;flex-wrap:wrap;\">\n        <button class=\"btn btn-ghost btn-sm\" onclick=\"exportData()\">📥 Export JSON<\u002Fbutton>\n        <button class=\"btn btn-ghost btn-sm\" onclick=\"document.getElementById('import-file').click()\">📤 Import JSON<\u002Fbutton>\n        <button class=\"btn btn-danger btn-sm\" onclick=\"if(confirm('Reset SEMUA data lokal? Data di Sheets tetap aman.')) { localStorage.removeItem(STORAGE_KEY); location.reload(); }\">🗑 Reset Lokal<\u002Fbutton>\n      <\u002Fdiv>\n      <p style=\"font-size:11px;color:var(--gray-500);margin-top:10px;\">Export JSON = backup tambahan. Kalau Sheets sudah terhubung, data sudah aman otomatis.<\u002Fp>\n      <input type=\"file\" id=\"import-file\" accept=\".json\" style=\"display:none;\" onchange=\"importData(event)\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv><!-- /main -->\n<\u002Fdiv><!-- /body-row -->\n\n<!-- MODAL: DEAL -->\n<div class=\"modal-overlay\" id=\"modal-deal\" onclick=\"if(event.target===this)closeModal('deal')\">\n  <div class=\"modal\">\n    <h3 id=\"modal-deal-title\">Tambah Deal<\u002Fh3>\n    <input type=\"hidden\" id=\"deal-edit-id\">\n    <div class=\"form-row\">\n      <div class=\"form-group\"><label>Nama Client *<\u002Flabel><input type=\"text\" id=\"d-client\" placeholder=\"PT ABC Indonesia\"><\u002Fdiv>\n      <div class=\"form-group\"><label>Jenis Layanan *<\u002Flabel>\n        <select id=\"d-service\">\n          <option value=\"company_profile\">Company Profile<\u002Foption><option value=\"immersive\">Immersive<\u002Foption>\n          <option value=\"iklan\">Iklan<\u002Foption><option value=\"it\">IT Services<\u002Foption><option value=\"film\">Film/Series<\u002Foption>\n        <\u002Fselect>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"form-row\">\n      <div class=\"form-group\"><label>Nilai Deal (IDR) *<\u002Flabel><input type=\"number\" id=\"d-value\" placeholder=\"25000000\"><\u002Fdiv>\n      <div class=\"form-group\"><label>Estimasi Biaya Produksi (IDR)<\u002Flabel><input type=\"number\" id=\"d-cogs\" placeholder=\"8000000\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"form-row\">\n      <div class=\"form-group\"><label>Tanggal Deal<\u002Flabel><input type=\"date\" id=\"d-date\"><\u002Fdiv>\n      <div class=\"form-group\"><label>Status<\u002Flabel>\n        <select id=\"d-status\">\n          <option value=\"prospect\">Prospect<\u002Foption><option value=\"won\">Won ✅<\u002Foption>\n          <option value=\"in_progress\">In Progress<\u002Foption><option value=\"delivered\">Delivered<\u002Foption>\n          <option value=\"paid\">Paid<\u002Foption><option value=\"lost\">Lost<\u002Foption>\n        <\u002Fselect>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"form-row\">\n      <div class=\"form-group\"><label>Payment Terms<\u002Flabel>\n        <select id=\"d-terms\">\n          <option value=\"50_50\">50% DP + 50% Selesai<\u002Foption><option value=\"100_upfront\">100% Upfront<\u002Foption>\n          <option value=\"net30\">Net 30<\u002Foption><option value=\"net60\">Net 60<\u002Foption><option value=\"installment\">Cicilan 3x<\u002Foption>\n        <\u002Fselect>\n      <\u002Fdiv>\n      <div class=\"form-group\"><label>Durasi Proyek (minggu)<\u002Flabel><input type=\"number\" id=\"d-duration\" placeholder=\"4\" min=\"1\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"form-group\">\n      <label>Retainer (recurring per bulan)?<\u002Flabel>\n      <div style=\"display:flex;align-items:center;gap:10px;margin-top:4px;\">\n        <input type=\"checkbox\" id=\"d-retainer\" onchange=\"toggleRetainer()\" style=\"width:auto;cursor:pointer;\">\n        <span style=\"font-size:13px;\">Ya, ini kontrak retainer<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"retainer-fields\" style=\"display:none;\">\n      <div class=\"form-group\"><label>Durasi Retainer (bulan)<\u002Flabel><input type=\"number\" id=\"d-retainer-months\" placeholder=\"6\" min=\"1\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"form-group\"><label>Catatan<\u002Flabel><textarea id=\"d-notes\" rows=\"2\" style=\"resize:none;\" placeholder=\"Detail tambahan...\"><\u002Ftextarea><\u002Fdiv>\n    <div class=\"modal-footer\">\n      <button class=\"btn btn-ghost\" onclick=\"closeModal('deal')\">Batal<\u002Fbutton>\n      <button class=\"btn btn-primary\" onclick=\"saveDeal()\">Simpan Deal<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- MODAL: EXPENSE -->\n<div class=\"modal-overlay\" id=\"modal-expense\" onclick=\"if(event.target===this)closeModal('expense')\">\n  <div class=\"modal\">\n    <h3>Tambah Pengeluaran<\u002Fh3>\n    <input type=\"hidden\" id=\"exp-edit-id\">\n    <div class=\"form-row\">\n      <div class=\"form-group\"><label>Tanggal *<\u002Flabel><input type=\"date\" id=\"e-date\"><\u002Fdiv>\n      <div class=\"form-group\"><label>Kategori *<\u002Flabel>\n        <select id=\"e-category\">\n          <option value=\"salary\">Gaji/SDM<\u002Foption><option value=\"software\">Software &amp; Tools<\u002Foption>\n          <option value=\"production\">Produksi<\u002Foption><option value=\"marketing\">Marketing<\u002Foption>\n          <option value=\"operations\">Operasional<\u002Foption><option value=\"freelancer\">Freelancer<\u002Foption>\n          <option value=\"equipment\">Peralatan<\u002Foption><option value=\"other\">Lainnya<\u002Foption>\n        <\u002Fselect>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"form-group\"><label>Deskripsi *<\u002Flabel><input type=\"text\" id=\"e-desc\" placeholder=\"Contoh: Adobe Creative Cloud\"><\u002Fdiv>\n    <div class=\"form-group\"><label>Jumlah (IDR) *<\u002Flabel><input type=\"number\" id=\"e-amount\" placeholder=\"2500000\"><\u002Fdiv>\n    <div class=\"form-group\">\n      <label>Recurring Bulanan?<\u002Flabel>\n      <div style=\"display:flex;align-items:center;gap:10px;margin-top:4px;\">\n        <input type=\"checkbox\" id=\"e-recurring\" style=\"width:auto;cursor:pointer;\">\n        <span style=\"font-size:13px;\">Pengeluaran rutin tiap bulan<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"form-group\"><label>Linked ke Proyek (opsional)<\u002Flabel>\n      <select id=\"e-deal\"><option value=\"\">— Tidak ada —<\u002Foption><\u002Fselect>\n    <\u002Fdiv>\n    <div class=\"form-group\">\n      <label>Status Pembayaran *<\u002Flabel>\n      <select id=\"e-pay-status\" onchange=\"document.getElementById('e-due-wrap').style.display=this.value==='dp'?'block':'none'\">\n        <option value=\"paid\">✅ Sudah Dibayar<\u002Foption>\n        <option value=\"dp\">⏳ Baru DP (50%)<\u002Foption>\n        <option value=\"unpaid\">❌ Belum Dibayar<\u002Foption>\n      <\u002Fselect>\n    <\u002Fdiv>\n    <div id=\"e-due-wrap\" class=\"form-group\" style=\"display:none;\">\n      <label>Tanggal Jatuh Tempo Pelunasan<\u002Flabel>\n      <input type=\"date\" id=\"e-due-date\">\n    <\u002Fdiv>\n    <div class=\"modal-footer\">\n      <button class=\"btn btn-ghost\" onclick=\"closeModal('expense')\">Batal<\u002Fbutton>\n      <button class=\"btn btn-primary\" onclick=\"saveExpense()\">Simpan<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- MODAL: INVOICE -->\n<div class=\"modal-overlay\" id=\"modal-invoice\" onclick=\"if(event.target===this)closeModal('invoice')\">\n  <div class=\"modal\">\n    <h3>Tambah Invoice Manual<\u002Fh3>\n    <input type=\"hidden\" id=\"inv-edit-id\">\n    <div class=\"form-group\"><label>Nama Client *<\u002Flabel><input type=\"text\" id=\"i-client\" placeholder=\"PT ABC Indonesia\"><\u002Fdiv>\n    <div class=\"form-row\">\n      <div class=\"form-group\"><label>Jumlah (IDR) *<\u002Flabel><input type=\"number\" id=\"i-amount\" placeholder=\"25000000\"><\u002Fdiv>\n      <div class=\"form-group\"><label>Tipe<\u002Flabel>\n        <select id=\"i-type\">\n          <option value=\"dp\">DP<\u002Foption><option value=\"progress\">Progress<\u002Foption>\n          <option value=\"final\">Final<\u002Foption><option value=\"full\">Full<\u002Foption>\n        <\u002Fselect>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"form-row\">\n      <div class=\"form-group\"><label>Tanggal Invoice<\u002Flabel><input type=\"date\" id=\"i-date\"><\u002Fdiv>\n      <div class=\"form-group\"><label>Jatuh Tempo<\u002Flabel><input type=\"date\" id=\"i-due\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"form-group\"><label>Status<\u002Flabel>\n      <select id=\"i-status\">\n        <option value=\"pending\">Pending<\u002Foption><option value=\"paid\">Paid<\u002Foption><option value=\"overdue\">Overdue<\u002Foption>\n      <\u002Fselect>\n    <\u002Fdiv>\n    <div class=\"modal-footer\">\n      <button class=\"btn btn-ghost\" onclick=\"closeModal('invoice')\">Batal<\u002Fbutton>\n      <button class=\"btn btn-primary\" onclick=\"saveInvoice()\">Simpan<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n// ═══════════════════════════════════════════════════════════\n// STATE\n// ═══════════════════════════════════════════════════════════\nconst STORAGE_KEY = 'aragi_finance_v2';\n\nlet state = {\n  deals:[], expenses:[], invoices:[],\n  settings:{ monthlyTarget:50000000, marginTarget:35, burnLimit:40, openingBalance:0, goal:18000000000, sheetsUrl:'', lastSync:null }\n};\n\nlet syncTimeout = null;\nlet isSyncing   = false;\n\nfunction loadLocal() {\n  const saved = localStorage.getItem(STORAGE_KEY);\n  if (saved) { try { state = JSON.parse(saved); } catch(e){} }\n}\n\nfunction saveLocal() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }\n\n// ═══════════════════════════════════════════════════════════\n// GOOGLE SHEETS SYNC\n// ═══════════════════════════════════════════════════════════\nfunction setSyncBar(status, msg) {\n  const dot = document.getElementById('sync-dot');\n  const txt = document.getElementById('sync-msg');\n  dot.className = status; // offline | syncing | synced | error\n  txt.textContent = msg;\n}\n\n// ── SUPABASE CONFIG ──────────────────────────────────────────\nconst SUPA_URL = 'https://yzjqvcaotwmukbitskuw.supabase.co';\nconst SUPA_KEY = 'sb_publishable_q6wO8fSt1po3WRNet4_f7Q_9OL3rdCY';\nconst SUPA_HEADERS = {\n  'Content-Type': 'application/json',\n  'apikey': SUPA_KEY,\n  'Authorization': 'Bearer ' + SUPA_KEY\n};\n\nasync function syncToSheets(quiet=false) {\n  if (isSyncing) return;\n  isSyncing = true;\n  if (!quiet) setSyncBar('syncing', 'Menyimpan ke Supabase...');\n  try {\n    const res = await fetch(SUPA_URL + '/rest/v1/aragi_data?id=eq.main', {\n      method: 'PATCH',\n      headers: { ...SUPA_HEADERS, 'Prefer': 'return=minimal' },\n      body: JSON.stringify({ payload: state, updated_at: new Date().toISOString() })\n    });\n    if (res.ok) {\n      state.settings.lastSync = new Date().toISOString();\n      saveLocal();\n      const t = new Date(state.settings.lastSync).toLocaleTimeString('id-ID');\n      setSyncBar('synced', 'Tersimpan di Supabase · ' + t);\n    } else {\n      const err = await res.text();\n      setSyncBar('error', 'Sync gagal: ' + err);\n    }\n  } catch(e) {\n    setSyncBar('error', 'Sync gagal — cek koneksi. Data tetap tersimpan lokal.');\n  }\n  isSyncing = false;\n}\n\nasync function loadFromSheets() {\n  setSyncBar('syncing', 'Memuat data dari Supabase...');\n  try {\n    const res  = await fetch(SUPA_URL + '/rest/v1/aragi_data?id=eq.main&select=payload', {\n      headers: SUPA_HEADERS\n    });\n    const rows = await res.json();\n    if (rows && rows[0] && rows[0].payload && Array.isArray(rows[0].payload.deals)) {\n      state = rows[0].payload;\n      saveLocal();\n      const t = new Date().toLocaleTimeString('id-ID');\n      setSyncBar('synced', 'Data dimuat dari Supabase · ' + t);\n      return true;\n    }\n    setSyncBar('error', 'Format data dari Supabase tidak valid.');\n    return false;\n  } catch(e) {\n    setSyncBar('error', 'Gagal load dari Supabase — pakai data lokal.');\n    return false;\n  }\n}\n\n// Debounced auto-sync: 2 detik setelah save terakhir baru sync ke Supabase\nfunction scheduleSync() {\n  saveLocal();\n  clearTimeout(syncTimeout);\n  setSyncBar('syncing', 'Menyimpan...');\n  syncTimeout = setTimeout(() => syncToSheets(), 2000);\n}\n\nasync function manualSync() {\n  const loaded = await loadFromSheets();\n  if (loaded) renderPage(currentPage);\n}\n\nasync function saveAndConnect() {\n  setSyncBar('syncing', 'Menghubungkan ke Supabase...');\n  const loaded = await loadFromSheets();\n  if (!loaded) await syncToSheets();\n  document.getElementById('connect-msg').textContent = '✓ Terhubung!';\n  setTimeout(() => document.getElementById('connect-msg').textContent = '', 3000);\n  renderSettings();\n}\n\n// ═══════════════════════════════════════════════════════════\n// HELPERS\n// ═══════════════════════════════════════════════════════════\nfunction uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }\nfunction today() { return new Date().toISOString().slice(0,10); }\n\nfunction fmtK(n) {\n  if (!n && n!==0) return '-';\n  const abs=Math.abs(Number(n)), sign=Number(n)<0?'-':'';\n  if (abs>=1e9) return sign+'Rp '+(abs/1e9).toFixed(1)+'M';\n  if (abs>=1e6) return sign+'Rp '+(abs/1e6).toFixed(1)+'jt';\n  if (abs>=1e3) return sign+'Rp '+(abs/1e3).toFixed(0)+'rb';\n  return sign+'Rp '+abs;\n}\n\nconst SVC  = { company_profile:'Company Profile', immersive:'Immersive', iklan:'Iklan', it:'IT Services', film:'Film/Series' };\nconst CAT  = { salary:'Gaji/SDM', software:'Software & Tools', production:'Produksi', marketing:'Marketing', operations:'Operasional', freelancer:'Freelancer', equipment:'Peralatan', other:'Lainnya' };\nconst STAT = { prospect:'Prospect', won:'Won', in_progress:'In Progress', delivered:'Delivered', paid:'Paid', lost:'Lost', pending:'Pending', overdue:'Overdue' };\n\nlet charts = {};\nlet currentPage = 'overview';\n\n// ═══════════════════════════════════════════════════════════\n// NAVIGATION\n// ═══════════════════════════════════════════════════════════\nfunction showPage(id) {\n  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));\n  document.querySelectorAll('.nav-item').forEach(n=>{\n    n.classList.remove('active');\n    if (n.getAttribute('onclick')&&n.getAttribute('onclick').includes(\"'\"+id+\"'\")) n.classList.add('active');\n  });\n  document.getElementById('page-'+id).classList.add('active');\n  currentPage = id;\n  renderPage(id);\n  if(window.innerWidth<=760) toggleNav(false);\n}\n\nfunction toggleNav(force){\n  const sb=document.querySelector('.sidebar'), sc=document.getElementById('scrim');\n  const open = force===undefined ? !sb.classList.contains('open') : force;\n  sb.classList.toggle('open', open);\n  sc.classList.toggle('show', open);\n}\n\nfunction renderPage(id) {\n  ({overview:renderOverview,crm:renderCRM,revenue:renderRevenue,expenses:renderExpenses,pl:renderPL,cashflow:renderCashFlow,services:renderServices,settings:renderSettings})[id]?.();\n}\n\n// ═══════════════════════════════════════════════════════════\n// OVERVIEW\n// ═══════════════════════════════════════════════════════════\nfunction renderOverview() {\n  const now=new Date(), cm=now.toISOString().slice(0,7);\n  const monthRev=state.invoices.filter(i=>i.status==='paid'&&i.date?.startsWith(cm)).reduce((s,i)=>s+Number(i.amount||0),0);\n  const monthExp=state.expenses.filter(e=>e.date?.startsWith(cm)).reduce((s,e)=>s+Number(e.amount||0),0);\n  const totalRev=state.invoices.filter(i=>i.status==='paid').reduce((s,i)=>s+Number(i.amount||0),0);\n  const pipVal=state.deals.filter(d=>d.status==='prospect').reduce((s,d)=>s+Number(d.dealValue||0),0);\n  const paidDeals=state.deals.filter(d=>d.status==='paid');\n  const tPR=paidDeals.reduce((s,d)=>s+Number(d.dealValue||0),0);\n  const tCOGS=paidDeals.reduce((s,d)=>s+Number(d.productionCost||0),0);\n  const gm=tPR>0?((tPR-tCOGS)/tPR*100).toFixed(1):0;\n  const br=monthRev>0?(monthExp/monthRev*100).toFixed(1):0;\n  const tgt=state.settings.monthlyTarget;\n  const tPct=tgt>0?Math.min(monthRev/tgt*100,100).toFixed(0):0;\n\n  const goalPct = state.settings.goal>0 ? Math.min(totalRev/state.settings.goal*100,100) : 0;\n  const gauge=(p,c,val,label,sub)=>`<div class=\"gauge-card\"><div class=\"gauge\" style=\"--c:${c}\"><div class=\"gauge-ring\" data-p=\"${p}\" style=\"--p:0\"><\u002Fdiv><div class=\"gauge-core\"><div class=\"gauge-val\">${val}<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"gauge-label\">${label}<\u002Fdiv><div class=\"gauge-sub\">${sub}<\u002Fdiv><\u002Fdiv>`;\n  document.getElementById('kpi-gauges').innerHTML =\n      gauge(Number(tPct), tPct<50?'var(--danger)':tPct<80?'var(--warning)':'var(--cyan)', tPct+'%','Target', fmtK(monthRev)+' / '+fmtK(tgt))\n    + gauge(Math.min(Number(gm),100), Number(gm)>=state.settings.marginTarget?'var(--success)':Number(gm)>=20?'var(--warning)':'var(--danger)', gm+'%','Margin','Target '+state.settings.marginTarget+'%')\n    + gauge(Math.min(Number(br),100), Number(br)>state.settings.burnLimit?'var(--danger)':Number(br)>state.settings.burnLimit*0.8?'var(--warning)':'var(--success)', br+'%','Burn Rate','Max '+state.settings.burnLimit+'%')\n    + gauge(goalPct, 'var(--violet)', goalPct.toFixed(0)+'%','Goal', fmtK(totalRev)+' / '+fmtK(state.settings.goal));\n  requestAnimationFrame(()=>{document.querySelectorAll('#kpi-gauges .gauge-ring[data-p]').forEach(r=>r.style.setProperty('--p', r.dataset.p));});\n\n  document.getElementById('kpi-cards').innerHTML=`\n    <div class=\"card primary\"><div class=\"card-label\">Revenue Bulan Ini<\u002Fdiv><div class=\"card-value\">${fmtK(monthRev)}<\u002Fdiv><div class=\"card-sub\">Target: ${fmtK(tgt)}<\u002Fdiv>\n      <div style=\"margin-top:8px;\"><div class=\"progress-bar\"><div class=\"progress-fill ${tPct<50?'danger':tPct<80?'warning':''}\" style=\"width:${tPct}%\"><\u002Fdiv><\u002Fdiv><div style=\"font-size:11px;color:var(--gray-500);margin-top:4px;\">${tPct}% dari target<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"card ${Number(br)>state.settings.burnLimit?'danger':'success'}\"><div class=\"card-label\">Pengeluaran Bulan Ini<\u002Fdiv><div class=\"card-value\">${fmtK(monthExp)}<\u002Fdiv><div class=\"card-sub\">Burn rate: ${br}% (max ${state.settings.burnLimit}%)<\u002Fdiv><\u002Fdiv>\n    <div class=\"card ${(monthRev-monthExp)>=0?'success':'danger'}\"><div class=\"card-label\">Net Profit Bulan Ini<\u002Fdiv><div class=\"card-value\">${fmtK(monthRev-monthExp)}<\u002Fdiv><div class=\"card-sub\">${monthRev>=monthExp?'Surplus ✅':'Defisit ⚠️'}<\u002Fdiv><\u002Fdiv>\n    <div class=\"card\"><div class=\"card-label\">Total Revenue<\u002Fdiv><div class=\"card-value\">${fmtK(totalRev)}<\u002Fdiv><div class=\"card-sub\">Goal: ${fmtK(state.settings.goal)}<\u002Fdiv><\u002Fdiv>\n    <div class=\"card ${Number(gm)>=state.settings.marginTarget?'success':'warning'}\"><div class=\"card-label\">Gross Margin<\u002Fdiv><div class=\"card-value\">${gm}%<\u002Fdiv><div class=\"card-sub\">Target: ${state.settings.marginTarget}%<\u002Fdiv><\u002Fdiv>\n    <div class=\"card\"><div class=\"card-label\">Pipeline Value<\u002Fdiv><div class=\"card-value\">${fmtK(pipVal)}<\u002Fdiv><div class=\"card-sub\">${state.deals.filter(d=>d.status==='prospect').length} prospek<\u002Fdiv><\u002Fdiv>`;\n\n  const months=[],revD=[],tgtD=[];\n  for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1),mk=d.toISOString().slice(0,7);months.push(d.toLocaleString('id-ID',{month:'short',year:'2-digit'}));revD.push(state.invoices.filter(inv=>inv.status==='paid'&&inv.date?.startsWith(mk)).reduce((s,inv)=>s+Number(inv.amount||0),0)/1e6);tgtD.push(tgt/1e6);}\n  mkChart('chart-revenue','bar',{labels:months,datasets:[{label:'Revenue (jt)',data:revD,backgroundColor:'#22d3ee',borderRadius:6},{label:'Target (jt)',data:tgtD,type:'line',borderColor:'#fb7185',borderDash:[4,4],pointRadius:0,fill:false,tension:0}]},{scales:{y:{ticks:{callback:v=>'Rp '+v+'jt'}}}});\n\n  const sR={};state.invoices.filter(i=>i.status==='paid').forEach(inv=>{const d=state.deals.find(d=>d.id===inv.dealId);const s=d?d.serviceType:'other';sR[s]=(sR[s]||0)+Number(inv.amount||0);});\n  const sK=Object.keys(sR),C=['#22d3ee','#22d3ee','#34d399','#fbbf24','#e879f9','#a855f7'];\n  mkChart('chart-services','doughnut',{labels:sK.map(k=>SVC[k]||k),datasets:[{data:sK.map(k=>sR[k]/1e6),backgroundColor:C}]},{plugins:{legend:{position:'bottom',labels:{font:{size:10}}}}});\n\n  const eC={};state.expenses.filter(e=>e.date?.startsWith(cm)).forEach(e=>{eC[e.category]=(eC[e.category]||0)+Number(e.amount||0);});\n  const eK=Object.keys(eC);\n  mkChart('chart-expenses','bar',{labels:eK.map(k=>CAT[k]||k),datasets:[{data:eK.map(k=>eC[k]/1e6),backgroundColor:'#fbbf24',borderRadius:6}]},{plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>'Rp '+v+'jt'}}}});\n\n  const sM={},sCt={};state.deals.filter(d=>['paid','delivered','in_progress'].includes(d.status)&&d.dealValue).forEach(d=>{const r=Number(d.dealValue),c=Number(d.productionCost||0);sM[d.serviceType]=(sM[d.serviceType]||0)+(r-c)/r*100;sCt[d.serviceType]=(sCt[d.serviceType]||0)+1;});\n  const mK=Object.keys(sM);\n  mkChart('chart-margin','bar',{labels:mK.map(k=>SVC[k]||k),datasets:[{data:mK.map(k=>(sM[k]/sCt[k]).toFixed(1)),backgroundColor:mK.map(k=>{const m=sM[k]/sCt[k];return m>=35?'#34d399':m>=20?'#fbbf24':'#fb7185';}),borderRadius:6}]},{plugins:{legend:{display:false}},scales:{y:{max:100,ticks:{callback:v=>v+'%'}}}});\n\n  const rec=[...state.deals].sort((a,b)=>b.dealDate>a.dealDate?1:-1).slice(0,5);\n  document.getElementById('recent-deals-table').innerHTML=rec.length\n    ?`<table><thead><tr><th>Client<\u002Fth><th>Layanan<\u002Fth><th>Nilai<\u002Fth><th>Status<\u002Fth><th>Tanggal<\u002Fth><\u002Ftr><\u002Fthead><tbody>${rec.map(d=>`<tr><td><strong>${d.client}<\u002Fstrong><\u002Ftd><td>${SVC[d.serviceType]||d.serviceType}<\u002Ftd><td>${fmtK(d.dealValue)}<\u002Ftd><td><span class=\"badge badge-${d.status}\">${STAT[d.status]||d.status}<\u002Fspan><\u002Ftd><td>${d.dealDate||'-'}<\u002Ftd><\u002Ftr>`).join('')}<\u002Ftbody><\u002Ftable>`\n    :'<div class=\"empty-state\">Belum ada deal. <a href=\"#\" onclick=\"showPage(\\'crm\\');openModal(\\'deal\\');return false;\">Tambah deal pertama →<\u002Fa><\u002Fdiv>';\n}\n\n// ═══════════════════════════════════════════════════════════\n// CRM\n// ═══════════════════════════════════════════════════════════\nfunction renderCRM() {\n  const sf=document.getElementById('filter-status')?.value||'',svf=document.getElementById('filte
